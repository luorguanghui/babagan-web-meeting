name: babagan-meeting

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-security: &default-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  caddy:
    image: "${CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}"
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:24.15.0-alpine3.23@sha256:d1b3b4da11eefd5941e7f0b9cf17783fc99d9c6fc34884a665f40a06dbdfc94f}"
        ALPINE_MIRROR: "${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:?LIVEKIT_INTERNAL_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      P2P_STUN_URLS: ${P2P_STUN_URLS:?P2P_STUN_URLS is required}
      P2P_TURN_URLS: ${P2P_TURN_URLS:?P2P_TURN_URLS is required}
      P2P_TURN_SECRET: ${P2P_TURN_SECRET:?P2P_TURN_SECRET is required}
      P2P_TURN_TTL_SECONDS: ${P2P_TURN_TTL_SECONDS:-600}
      P2P_TURN_PROVIDER: ${P2P_TURN_PROVIDER:-coturn}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_TURN_TTL_SECONDS: ${CLOUDFLARE_TURN_TTL_SECONDS:-600}
      CLOUDFLARE_TURN_CONNECT_IPS: ${CLOUDFLARE_TURN_CONNECT_IPS:-}
      CLOUDFLARE_TURN_HTTPS_PROXY: ${CLOUDFLARE_TURN_HTTPS_PROXY:-}
      DATABASE_PATH: /data/meetings.sqlite
    volumes:
      - api-data:/data
    expose:
      - "3000"
    networks:
      - edge
      - backend
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    depends_on:
      livekit:
        condition: service_healthy
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  livekit:
    image: "${LIVEKIT_IMAGE:-livekit/livekit-server:v1.11.0@sha256:100b9a870616d02f5e3795b34e0b593b5054a26f8131a94fd3fa322ed3154b16}"
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP is required}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    logging: *default-logging
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    image: "${COTURN_IMAGE:-coturn/coturn:4.17.2-r0@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e}"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/start-turnserver.sh"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      TURN_RELAY_IP: ${TURN_RELAY_IP:?TURN_RELAY_IP is required}
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/start-turnserver.sh:/usr/local/bin/start-turnserver.sh:ro
      - caddy-data:/caddy-data:ro
    depends_on:
      caddy:
        condition: service_healthy
    logging: *default-logging
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/turnserver.pid && kill -0 $$(cat /tmp/turnserver.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:24.15.0-alpine3.23@sha256:d1b3b4da11eefd5941e7f0b9cf17783fc99d9c6fc34884a665f40a06dbdfc94f}"
        CADDY_IMAGE: "${CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - backend
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1

volumes:
  api-data:
  caddy-data:
  caddy-config:
