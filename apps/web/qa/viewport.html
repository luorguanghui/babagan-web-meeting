<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/png" href="/theme/favicon-32.png" /><meta charset="utf-8"><title>Babagan · isolated responsive QA</title>
    <style>html,body{margin:0;background:#e9ebe5}iframe{display:block;border:0;background:#faf9f6}</style>
  </head>
  <body><iframe allow="fullscreen" title="Isolated Babagan preview"></iframe>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const frame = document.querySelector('iframe');
      frame.width = String(Math.min(3840, Math.max(320, Number(params.get('width')) || 1488)));
      frame.height = String(Math.min(2160, Math.max(240, Number(params.get('height')) || 1056)));
      const scale = Math.min(1, Math.max(.5, Number(params.get('scale')) || 1));
      frame.style.transform = `scale(${scale})`;
      frame.style.transformOrigin = 'top left';
      const platform = params.get('platform');
      if (platform === 'android' || platform === 'windows') {
        frame.src = `./client.html?${new URLSearchParams({ platform, locale: params.get('lang') || 'zh-CN' })}`;
      } else {
        frame.src = `./preview.html?${new URLSearchParams({
          scene: params.get('scene') || 'receiver', lang: params.get('lang') || 'zh-CN',
          source: params.get('source') || 'landscape', fullscreen: params.get('fullscreen') || 'native',
          noticeHeight: params.get('noticeHeight') || '0', design: params.get('design') || ''
        })}`;
      }
    </script>
  </body>
</html>
